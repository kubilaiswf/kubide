[workspace]
resolver = "2"
members = [
    "crates/kb-win",
    "crates/kb-gfx",
    "crates/kb-text",
    "crates/kb-ui",
    "crates/kb-term",
    "crates/kb-cfg",
    "crates/kb-edit",
    "crates/kb-find",
    "crates/kb-fs",
    "crates/kb-git",
    "crates/kb-syn",
    "crates/kb-vim",
    "crates/kb-agent",
    "crates/kubide",
]

# New crates get added when they are needed; no empty skeletons.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

# Windows: raw Win32, Direct2D and DirectWrite, nothing in between.
[workspace.dependencies]
windows-numerics = "0.3"

[workspace.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Linux: there is no Direct2D to speak to directly, so the same seams are
# filled by the smallest pure-Rust pieces that do one job each. winit opens
# the window on X11 and Wayland alike (no toolkit, no client-side decoration
# library — the caption is ours on every platform); tiny-skia rasterises the
# few shapes draw.rs asks for; cosmic-text shapes and rasterises glyphs the
# way DirectWrite does; softbuffer puts the frame on an X11 window, and the
# Wayland presenter is written by hand in kb-gfx because softbuffer's drops
# the alpha channel there. arboard is the clipboard on both display servers.
[workspace.dependencies.winit]
version = "0.30"
default-features = false
features = ["rwh_06", "x11", "wayland", "wayland-dlopen"]

[workspace.dependencies.softbuffer]
version = "0.4"
default-features = false
features = ["x11", "x11-dlopen"]

[workspace.dependencies.arboard]
version = "3"
default-features = false
features = ["wayland-data-control"]

[workspace.dependencies.tiny-skia]
version = "0.12"

[workspace.dependencies.cosmic-text]
version = "0.19"

[workspace.dependencies.wayland-client]
version = "0.31"

[workspace.dependencies.raw-window-handle]
version = "0.6"

[workspace.dependencies.libc]
version = "0.2"

[workspace.dependencies.png]
version = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1        # D2D/DWrite calls are painfully slow in debug
