[workspace]
resolver = "2"
members = [
    "crates/kb-win",
    "crates/kb-gfx",
    "crates/kb-text",
    "crates/kb-ui",
    "crates/kb-term",
    "crates/kb-cfg",
    "crates/kb-edit",
    "crates/kb-find",
    "crates/kb-fs",
    "crates/kb-git",
    "crates/kb-syn",
    "crates/kb-vim",
    "crates/kb-agent",
    "crates/kubide",
]

# New crates get added when they are needed; no empty skeletons.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[workspace.dependencies]
windows-numerics = "0.3"

[workspace.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1        # D2D/DWrite calls are painfully slow in debug
