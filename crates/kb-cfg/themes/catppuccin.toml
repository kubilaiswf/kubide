# Catppuccin Mocha for kubide.
#
# Copy, recolour, save as mytheme.toml, set `theme = "mytheme"` in
# config.toml. Anything left out keeps kubide's default.

fg = "#cdd6f4"
dim = "#a6adc8"
accent = "#89b4fa"
warning = "#f9e2af"
error = "#f38ba8"
divider = "#cdd6f41a"
overlay = "#11111be0"

[caption]
fg = "#a6adc8"
icon = "#cdd6f4"
hover = "#ffffff17"
press = "#ffffff0d"
close_hover = "#f38ba8d9"
close_press = "#eba0ace6"

[terminal]
background = "#11111b"
foreground = "#cdd6f4"
cursor = "#f5e0dcbf"
selection = "#45475a"

[terminal.ansi]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"
bright_black = "#585b70"
bright_red = "#f5a3ba"
bright_green = "#b8e9b4"
bright_yellow = "#fae8c0"
bright_blue = "#9cc0fb"
bright_magenta = "#f7cfed"
bright_cyan = "#a8e8dd"
bright_white = "#cdd6f4"

[git]
modified = "#f9e2af"
added = "#a6e3a1"
deleted = "#f38ba8"
untracked = "#89dceb"
conflicted = "#f5c2e7"

[syntax]
keyword = "#cba6f7"
function = "#89b4fa"
type = "#f9e2af"
string = "#a6e3a1"
number = "#fab387"
comment = "#6c7086"
constant = "#fab387"
operator = "#94e2d5"
punctuation = "#9399b2"
variable = "#cdd6f4"
property = "#b4befe"
attribute = "#f9e2af"
